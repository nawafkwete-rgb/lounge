<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F1319">
<title>نظام الصالة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1319; --panel:#171D26; --panel2:#1E2632; --line:#28323F;
  --felt:#22B573; --felt-dim:#15503A; --money:#F2B94B; --danger:#E85D5D; --smoke:#9B7EDE; --warn:#F2994A; --info:#4FA3E0;
  --text:#E9EDF2; --muted:#8B96A3; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font-family:'Tajawal',sans-serif;min-height:100vh;padding-bottom:92px;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Cairo',sans-serif}
button{font-family:'Tajawal';cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--felt);outline-offset:1px}
header{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:19px;font-weight:800}
.who{color:var(--muted);font-size:12px;text-align:left;line-height:1.5}
.who b{color:var(--felt)}
.who button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:2px 8px;font-size:11px;margin-top:2px}
.container{padding:0 12px;max-width:1240px;margin:0 auto}
@media (min-width:1000px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}#tab-sales,#tab-shift,#tab-debts,#tab-reports,#tab-settings{max-width:860px;margin:0 auto}}

#loginScreen{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.loginBox{width:100%;max-width:340px;text-align:center}
.loginBox h1{font-size:26px;margin-bottom:4px}
.loginBox .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.staffBtns{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.staffBtns button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px;font-size:15px;font-weight:700}
.staffBtns button.sel{border-color:var(--felt);color:var(--felt)}
#pinRow{display:none}
#pinRow.show{display:block}
.pinInput{text-align:center;font-size:22px;letter-spacing:8px;font-family:'Cairo'}

.tabs{position:fixed;bottom:0;right:0;left:0;background:var(--panel);border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:none;color:var(--muted);padding:9px 1px 11px;font-size:11px;font-weight:700;min-width:0}
.tabs button.active{color:var(--felt)}
.tabs button .ic{display:block;font-size:19px;margin-bottom:2px}

.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-align:center}
.box .lbl{font-size:11px;color:var(--muted)}
.box .val{font-size:17px;font-weight:800;font-family:'Cairo'}
.shiftbar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin:6px 0 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.shiftbar.none{border-color:var(--warn);color:var(--warn)}
.overbar{position:sticky;top:0;z-index:40;background:var(--danger);color:#fff;border-radius:12px;padding:10px 12px;margin:0 0 10px;font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.overbar button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:20px;padding:4px 10px;font-size:13px;font-weight:700}
.green{color:var(--felt)} .gold{color:var(--money)} .red{color:var(--danger)} .purple{color:var(--smoke)} .muted{color:var(--muted)} .orange{color:var(--warn)}

.gtitle{font-size:13px;color:var(--muted);font-weight:700;margin:14px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px;position:relative}
.card.busy{border-color:var(--felt);background:linear-gradient(180deg,rgba(34,181,115,.08),var(--panel))}
.card.warn{border-color:var(--warn);background:linear-gradient(180deg,rgba(242,153,74,.12),var(--panel))}
.card.over{border-color:var(--danger);background:linear-gradient(180deg,rgba(232,93,93,.16),var(--panel));animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(232,93,93,.25)}}
.card .name{font-weight:700;font-size:15px;padding-left:52px}
.card .rate{color:var(--muted);font-size:12px;margin-top:2px}
.card .timer{font-family:'Cairo';font-size:21px;font-weight:800;margin:6px 0 0;letter-spacing:.5px}
.card.busy .timer{color:var(--felt)} .card.warn .timer{color:var(--warn)} .card.over .timer{color:var(--danger)}
.card .sub2{font-size:11px;color:var(--muted);min-height:15px}
.card .amount{font-size:13px;color:var(--money);font-weight:700;min-height:18px}
.card .otag{font-size:11px;color:var(--smoke);min-height:15px}
.card .note{font-size:11px;color:var(--info);min-height:0}
.card .main{width:100%;margin-top:8px;padding:9px;border:none;border-radius:10px;font-weight:700;font-size:14px}
.card .acts{display:flex;gap:6px;margin-top:6px}
.card .acts button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 2px;font-size:12px;font-weight:700}
.btn-start{background:var(--felt);color:#08130D}
.btn-stop{background:var(--danger);color:#fff}
.badge{position:absolute;top:10px;left:10px;font-size:10px;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--muted)}
.card.busy .badge{background:var(--felt-dim);color:var(--felt)}
.card.warn .badge{background:rgba(242,153,74,.2);color:var(--warn)}
.card.over .badge{background:rgba(232,93,93,.2);color:var(--danger)}

.catTitle{font-family:'Cairo';font-weight:800;font-size:14px;color:var(--felt);margin:14px 2px 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.catTitle:first-child{margin-top:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;margin-bottom:6px}
.pbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;color:var(--text)}
.pbtn:active{border-color:var(--smoke)}
.pbtn .pn{font-weight:700;font-size:13px;line-height:1.35}
.pbtn .pp{color:var(--money);font-size:12px;font-family:'Cairo';font-weight:800;margin-top:4px}

.section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.section h2{font-size:15px;margin-bottom:10px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.section h2 small{font-family:'Tajawal';font-size:12px;color:var(--muted);font-weight:500}
.hint{color:var(--muted);font-size:12.5px;line-height:1.6;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.row:last-child{border-bottom:none}
.row.total{font-weight:800;border-top:2px solid var(--line)}
.row.sub{padding-right:14px;font-size:13px;color:var(--muted)}
.row .s{color:var(--muted);font-size:12px;margin-top:2px}
.row .amt{font-family:'Cairo';font-weight:800;white-space:nowrap}
.row.void{opacity:.5} .row.void .amt{text-decoration:line-through}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--panel2);color:var(--muted);margin-inline-start:4px;vertical-align:middle}
.tag.cash{color:var(--felt)} .tag.transfer{color:var(--info)} .tag.debt{color:var(--warn)} .tag.void{color:var(--danger)}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:13px}
.spin{color:var(--muted);text-align:center;padding:28px 0}

input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;font-family:'Tajawal';font-size:15px;width:100%}
input:focus,select:focus{border-color:var(--felt)}
label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
.frow{display:flex;gap:8px;margin-top:8px;align-items:center}
.frow > *{min-width:0}
.btn{background:var(--felt);color:#08130D;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.red{background:var(--danger);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.mini{background:none;border:none;color:var(--danger);font-size:16px;padding:4px 6px}
.linkbtn{background:none;border:none;color:var(--info);font-size:12px;font-weight:700;padding:2px 4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 6px;font-weight:700;font-size:13px}
.seg button.on{border-color:var(--felt);color:var(--felt);background:rgba(34,181,115,.1)}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:'Cairo';font-weight:800;font-size:19px;margin-top:2px}
.kpi .d{font-size:11px;color:var(--muted)}
.alert{border-radius:10px;padding:9px 11px;font-size:13px;margin:6px 0;line-height:1.55}
.alert.bad{background:rgba(232,93,93,.12);border:1px solid rgba(232,93,93,.5);color:#F2A1A1}
.alert.ok{background:rgba(34,181,115,.1);border:1px solid rgba(34,181,115,.4);color:#7FD8AD}
.alert.warn{background:rgba(242,153,74,.1);border:1px solid rgba(242,153,74,.45);color:#F5BD8A}
.bars{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:6px;direction:ltr}
.bars div{flex:1;background:var(--felt-dim);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.top{background:var(--felt)}
.barsx{display:flex;gap:2px;direction:ltr;font-size:9px;color:var(--muted);margin-top:3px}
.barsx span{flex:1;text-align:center}
.hbar{height:6px;background:var(--panel2);border-radius:4px;margin-top:5px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--felt);border-radius:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--muted);font-weight:500;font-size:11.5px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl td.n{font-family:'Cairo';font-weight:700;white-space:nowrap}
.scrollx{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700}
.chips button.on{border-color:var(--felt);color:var(--felt)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:0}
.overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
@media (min-width:640px){.overlay{align-items:center;padding:16px}.modal{border-radius:18px}}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .info{color:var(--muted);font-size:13px;margin-bottom:10px}
.modal .actions{display:flex;gap:8px;margin-top:16px}
.modal .actions .btn{flex:1}
.bignum{font-family:'Cairo';font-weight:800;font-size:30px;color:var(--money);text-align:center;margin:10px 0 2px}
.qty{display:flex;align-items:center;gap:14px;justify-content:center;margin:6px 0}
.qty button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:22px}
.qty .qv{font-family:'Cairo';font-size:26px;font-weight:800;min-width:40px;text-align:center}
.devPick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.devPick button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 6px;font-weight:700;font-size:13px}

.toast{position:fixed;top:14px;right:50%;transform:translateX(50%);background:var(--felt);color:#08130D;padding:10px 18px;border-radius:30px;font-weight:700;font-size:14px;z-index:400;display:none;max-width:92%;text-align:center}
.toast.show{display:block}
.toast.err{background:var(--danger);color:#fff}
.hidden{display:none!important}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;inset:0;background:#fff;color:#000;padding:10px;font-family:Tajawal,sans-serif;font-size:13px}
  #printArea .r{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #999}
  #printArea h4{text-align:center;font-size:16px;margin-bottom:6px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="loginBox">
    <h1>🎱 نظام الصالة</h1>
    <div class="sub">اختار اسمك وأدخل الرقم السري</div>
    <div class="staffBtns" id="staffBtns"><div class="spin">جاري التحميل...</div></div>
    <div id="pinRow">
      <input class="pinInput" id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">
      <div style="margin-top:12px"><button class="btn wide" id="loginBtn" onclick="tryLogin()">دخول</button></div>
    </div>
  </div>
</div>

<header>
  <h1>🎱 نظام الصالة</h1>
  <div class="who"><span id="todayDate"></span><br><b id="whoName"></b> <button onclick="logout()">خروج</button></div>
</header>

<div class="container">
  <div id="overBar"></div>
  <div id="topStrip"></div>

  <div id="tab-devices"><div id="deviceGroups"><div class="spin">جاري التحميل...</div></div></div>

  <div id="tab-sales" class="hidden">
    <div class="section"><h2>بيع سريع <small>اكبس على الصنف</small></h2><div id="productGrid"></div></div>
    <div class="section"><h2>مبيعات الوردية</h2><div id="salesList"><div class="empty">—</div></div></div>
  </div>

  <div id="tab-shift" class="hidden"><div id="shiftBody"><div class="spin">جاري التحميل...</div></div></div>

  <div id="tab-debts" class="hidden">
    <div class="section">
      <h2>الديون <small id="debtTotal"></small></h2>
      <input id="debtSearch" placeholder="ابحث باسم الزبون أو رقمه" oninput="renderDebts()">
      <div id="debtList" style="margin-top:8px"><div class="spin">جاري التحميل...</div></div>
    </div>
    <div class="section">
      <h2>زبون جديد</h2>
      <div class="frow"><input id="newCustName" placeholder="الاسم"><input id="newCustPhone" placeholder="الموبايل (اختياري)" inputmode="tel"></div>
      <div class="frow"><button class="btn wide" onclick="addCustomer()">إضافة الزبون</button></div>
    </div>
  </div>

  <div id="tab-reports" class="hidden">
    <div class="chips" id="rangeChips"></div>
    <div id="customRange" class="section hidden">
      <div class="frow"><div style="flex:1"><label>من</label><input type="date" id="rFrom"></div><div style="flex:1"><label>إلى</label><input type="date" id="rTo"></div></div>
      <div class="frow"><button class="btn wide" onclick="loadReport('custom')">عرض التقرير</button></div>
    </div>
    <div id="reportBody"><div class="spin">جاري التحميل...</div></div>
  </div>

  <div id="tab-settings" class="hidden"><div id="settingsBody"><div class="spin">جاري التحميل...</div></div></div>
</div>

<nav class="tabs" id="tabsNav"></nav>

<div class="overlay" id="overlay" onclick="if(event.target===this && !modalLocked) closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* ================== الاتصال ================== */
const SB_URL = 'https://zfudnrgkcahdkbbsuulf.supabase.co/rest/v1/rpc/';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmdWRucmdrY2FoZGtiYnN1dWxmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5ODcyMTksImV4cCI6MjEwOTU2MzIxOX0.OfrEukO7-6KcEo-zfMko-WpW-X3WtLc5tWKcKuvnuW8';

const ERR = {
  AUTH:'انتهت الجلسة، سجّل دخول من جديد', OWNER_ONLY:'هالعملية لصاحب المحل فقط',
  BAD_LOGIN:'الرقم السري غلط', LOCKED:'الحساب مقفول 10 دقائق بسبب محاولات غلط',
  NO_SHIFT:'لازم تفتح الوردية أول (تبويب الوردية)', SHIFT_OPEN:'في وردية مفتوحة أصلاً',
  DEVICE_BUSY:'الجهاز مشغول', SESSION_CLOSED:'الجلسة انقفلت أو انلغت', NOT_FOUND:'العنصر مو موجود',
  BAD_QTY:'العدد غير صحيح', BAD_PAY:'اختار طريقة الدفع', NEED_CUSTOMER:'اختار الزبون للدين',
  BAD_DISCOUNT:'الخصم غير صحيح', NEED_REASON:'اكتب السبب', APPROVAL:'لازم رقم صاحب المحل للموافقة (أو الرقم غلط)',
  APPROVAL_LOCKED:'الموافقات مقفولة 15 دقيقة بسبب محاولات غلط', ORDER_LOCKED:'ما بينلغى طلب من جلسة مقفولة',
  SHIFT_CLOSED:'هالعملية من وردية مقفولة — صاحب المحل فقط', BAD_AMOUNT:'المبلغ غير صحيح', NEED_NAME:'اكتب الاسم',
  SAME_DEVICE:'نفس الجهاز', BAD_LIMIT:'المدة غير صحيحة', BAD_PIN:'الرقم السري لازم 4 لـ 8 أرقام',
  BAD_OLD_PIN:'الرقم الحالي غلط', LAST_OWNER:'لازم يضل صاحب محل واحد عالأقل', SELF:'ما فيك تحذف حالك',
  BAD_ROLE:'الدور غير صحيح', BAD_SETTING:'قيمة إعداد غير صحيحة', BAD_PASSWORD:'كلمة سر التصفير غلط', BAD_SCOPE:'نطاق غير صحيح',
  NET:'ما في اتصال بالنت — جرّب مرة تانية'
};
class ApiError extends Error{ constructor(code, data){ super(ERR[code] || code); this.code = code; this.data = data; } }

async function rpc(fn, args){
  let res;
  try{
    res = await fetch(SB_URL + fn, { method:'POST',
      headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify(args || {}) });
  }catch(e){ throw new ApiError('NET'); }
  const txt = await res.text();
  let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!res.ok){
    const msg = (data && (data.message || data.hint)) || '';
    let code = (msg.match(/^[A-Z_]+$/) || [])[0];
    if(!code && /lounge_one_open_per_device/.test(msg)) code = 'DEVICE_BUSY';
    if(!code && /lounge_one_open_shift/.test(msg)) code = 'SHIFT_OPEN';
    const err = new ApiError(code || 'NET', data);
    if(code === 'AUTH') onAuthLost();
    throw err;
  }
  if(data && typeof data === 'object' && !Array.isArray(data) && data.error) throw new ApiError(data.error, data);
  return data;
}
const T = (fn, args) => rpc(fn, Object.assign({ p_token: token }, args || {}));

/* ================== أدوات ================== */
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ if(v == null) return NaN; const s = String(v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[,٬\s]/g,'').trim(); return s === '' ? NaN : Number(s); }
const fmtNum = n => new Intl.NumberFormat('ar-SY').format(Math.round(Number(n) || 0));
const fmtDec = n => new Intl.NumberFormat('ar-SY',{maximumFractionDigits:1}).format(Number(n) || 0);
const cur = () => (S && S.settings && S.settings.currency) || 'ل.س';
const money = n => fmtNum(n) + ' ' + cur();
function fmtDur(min){ const s = Math.max(0, Math.floor(min * 60)); return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
const fmtTime = ts => new Date(ts).toLocaleTimeString('ar-SY',{hour:'2-digit',minute:'2-digit'});
const fmtDate = ts => new Date(ts).toLocaleDateString('ar-SY',{weekday:'short',day:'numeric',month:'short'});
const fmtDT = ts => fmtDate(ts) + ' ' + fmtTime(ts);
const PAY = { cash:'نقدي', transfer:'تحويل', debt:'دين', session:'على جلسة' };
const payTag = p => `<span class="tag ${esc(p)}">${esc(PAY[p] || p)}</span>`;
const CAT_ORDER = ['أراكيل','باردة','ساخنة','أخرى'];
const CAT_LABEL = { 'أراكيل':'💨 أراكيل', 'باردة':'🧊 مشروبات باردة', 'ساخنة':'☕ مشروبات ساخنة', 'أخرى':'📌 أخرى' };
const GRP_ICON = { 'كمبيوتر':'🖥️', 'بلايستيشن':'🎮', 'بلياردو':'🎱', 'طاولة ورق':'🃏' };
function groupBy(arr, keyFn, order){
  const m = {}; arr.forEach(x => { const k = keyFn(x); (m[k] = m[k] || []).push(x); });
  const keys = Object.keys(m); if(order) keys.sort((a,b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia<0?99:ia) - (ib<0?99:ib); });
  return keys.map(k => [k, m[k]]);
}
function ymd(d){ const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); }
function dayStart(d){ const x = new Date(d || Date.now()); x.setHours(0,0,0,0); return x; }

let toastTimer = null;
function toast(msg, isErr){ const t = $('toast'); t.textContent = msg; t.classList.toggle('err', !!isErr); t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), isErr ? 3600 : 2400); }
function fail(e){ toast('⚠️ ' + (e && e.message || 'خطأ'), true); }

let modalLocked = false;
function openModal(html){ $('modal').innerHTML = html; $('overlay').classList.add('show'); modalLocked = false; }
function closeModal(){ $('overlay').classList.remove('show'); $('modal').innerHTML = ''; }
async function busy(btn, fn){ if(btn){ btn.disabled = true; } modalLocked = true; try{ return await fn(); } finally{ modalLocked = false; if(btn && document.body.contains(btn)) btn.disabled = false; } }

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* حساب الفاتورة (نسخة طبق الأصل عن السيرفر للعرض الحي) */
function billOf(s){
  const st = S.settings;
  const round = Math.max(Number(st.round_minutes) || 1, 1), min = Math.max(Number(st.min_minutes) || 0, 0), grace = Math.max(Number(st.grace_minutes) || 0, 0);
  const seg = Math.max((Date.now() - new Date(s.start_at).getTime()) / 60000, 0);
  const cm = Number(s.carried_minutes) || 0, ca = Number(s.carried_amount) || 0;
  const tot = cm + seg;
  const billed = Math.max(min, Math.ceil(Math.max(tot - grace, 0) / round) * round);
  const time = Math.max(Math.round(ca + Number(s.rate) * (billed - cm) / 60), 0);
  const orders = (s.orders || []).reduce((a,o) => a + Number(o.total), 0);
  return { tot, billed, time, orders };
}

      box.appendChild(b);
    });

async function tryLogin(){

let refreshing = false;

function showTab(name){

/* ================== الأجهزة ================== */
const sessionOf = devId => S.sessions.find(s => s.device_id === devId);
function cardState(s){
  if(!s) return '';
  if(s.limit_minutes){ const left = s.limit_minutes - billOf(s).tot; if(left <= 0) return 'over'; if(left <= 5) return 'warn'; }
  return 'busy';
}
function renderDevices(){
  const wrap = $('deviceGroups'); wrap.innerHTML = '';
  if(!S.devices.length){ wrap.innerHTML = '<div class="empty">ما في أجهزة — ضيفها من الإعدادات</div>'; return; }
  groupBy(S.devices, d => d.grp || 'أخرى', Object.keys(GRP_ICON)).forEach(([g, list]) => {
    const busyN = list.filter(d => sessionOf(d.id)).length;
    wrap.insertAdjacentHTML('beforeend', `<div class="gtitle">${GRP_ICON[g] || '📌'} ${esc(g)} — مشغول ${fmtNum(busyN)} من ${fmtNum(list.length)}</div>`);
    const grid = document.createElement('div'); grid.className = 'grid';
    list.forEach(d => {
      const s = sessionOf(d.id), cs = cardState(s);
      const card = document.createElement('div'); card.className = 'card ' + cs; card.id = 'card-' + d.id;
      if(!s){
        card.innerHTML = `<span class="badge">متاح</span><div class="name">${esc(d.name)}</div><div class="rate">${money(d.rate)} / ساعة</div>
          <div class="timer muted">00:00:00</div><div class="sub2"></div><div class="amount"></div>
          <button class="main btn-start" onclick="startModal('${d.id}')">بدء</button>`;
      } else {
        const ordN = (s.orders || []).length;
        card.innerHTML = `<span class="badge" id="bd-${d.id}">${cs==='over'?'انتهى الوقت':cs==='warn'?'قرب يخلص':'مشغول'}</span>
          <div class="name">${esc(d.name)}</div><div class="rate">${money(d.rate)} / ساعة</div>
          <div class="timer" id="tm-${d.id}"></div><div class="sub2" id="sb-${d.id}"></div>
          <div class="amount" id="am-${d.id}"></div>
          <div class="otag">${ordN ? `+ ${fmtNum(ordN)} طلب` : ''}</div>
          ${s.note ? `<div class="note">📝 ${esc(s.note)}</div>` : ''}
          <button class="main btn-stop" onclick="closeSessionModal('${s.id}')">إنهاء وقبض</button>
          <div class="acts"><button onclick="orderToSessionModal('${s.id}')">＋ طلب</button><button onclick="transferModal('${s.id}')">⇄ نقل</button><button onclick="cancelModal('${s.id}')">✕ إلغاء</button></div>`;
      }
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
  });
  tick();
}
function tick(){
  if(!S) return;
  renderOverBar();
  S.sessions.forEach(s => {
    const tm = $('tm-' + s.device_id); if(!tm) return;
    const b = billOf(s);
    if(s.limit_minutes){
      const left = s.limit_minutes - b.tot;
      tm.textContent = left >= 0 ? fmtDur(left) : '+' + fmtDur(-left);
      $('sb-' + s.device_id).textContent = left >= 0 ? `باقي من ${fmtNum(s.limit_minutes)} د` : `تجاوز الوقت المحدد (${fmtNum(s.limit_minutes)} د)`;
      const cs = left <= 0 ? 'over' : left <= 5 ? 'warn' : 'busy';
      const card = $('card-' + s.device_id);
      if(card && !card.classList.contains(cs)){ card.classList.remove('busy','warn','over'); card.classList.add(cs); const bd = $('bd-'+s.device_id); if(bd) bd.textContent = cs==='over'?'انتهى الوقت':cs==='warn'?'قرب يخلص':'مشغول'; }
      if(left <= 0 && !beeped.has(s.id)){ beeped.add(s.id); beep(); toast('⏰ خلص الوقت على ' + s.device_name, true); }
    } else {
      tm.textContent = fmtDur(b.tot);
      $('sb-' + s.device_id).textContent = 'من ' + fmtTime(s.first_start_at) + ' — ' + (s.opened_by || '');
    }
    $('am-' + s.device_id).textContent = money(b.time + b.orders);
  });
}
function renderOverBar(){
  const el = $('overBar'); if(!el || !S) return;
  const over = S.sessions.filter(s => s.limit_minutes && s.limit_minutes - billOf(s).tot <= 0);
  const key = over.map(s => s.id).join(',');
  if(el.dataset.key === key) return; el.dataset.key = key;
  el.innerHTML = over.length ? `<div class="overbar">⏰ خلص الوقت: ${over.map(s => `<button onclick="goCard('${s.device_id}')">${esc(s.device_name)}</button>`).join('')}</div>` : '';
}
function goCard(devId){
  if(currentTab !== 'devices') showTab('devices');
  setTimeout(() => { const c = $('card-' + devId); if(c) c.scrollIntoView({ behavior:'smooth', block:'center' }); }, 60);
}
function beep(){
  try{ const ctx = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(.2, ctx.currentTime + t); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .15); }); }catch(e){}
}

    <div id="cReasonWrap" class="hidden"><label>سبب الخصم (إجباري)</label><input id="cReason" maxlength="80" placeholder="مثلاً: زبون دائم، عطل بالجهاز"></div>
    <label>طريقة الدفع</label>
    <div class="seg" id="paySeg"><button class="on" data-v="cash">💵 نقدي</button><button data-v="transfer">📲 تحويل</button><button data-v="debt">📒 دين</button></div>
    <div id="custWrap" class="hidden">${custPickerHtml('c')}</div>
    <div id="apprWrap" class="hidden"><label>الخصم فوق حدّك (${fmtNum(q.max_staff_discount)}%) — رقم صاحب المحل للموافقة</label><input id="cAppr" type="password" inputmode="numeric" maxlength="8" placeholder="••••"></div>

  bindCustPicker('c', id => closeCust = id);

function updClose(){
  const q = CQ; let d = num($('cDisc').value); if(isNaN(d) || d < 0) d = 0; if(d > q.gross) d = q.gross;
  $('cNet').textContent = money(q.gross - d);
  $('cReasonWrap').classList.toggle('hidden', !(d > 0));
  const needAppr = !isOwner() && d > q.gross * Number(q.max_staff_discount) / 100;
  $('apprWrap').classList.toggle('hidden', !needAppr);
}
async function doClose(){
  const q = CQ; let d = num($('cDisc').value); if(isNaN(d)) d = 0;
  if(d < 0 || d > q.gross){ toast(ERR.BAD_DISCOUNT, true); return; }
  if(d > 0 && !$('cReason').value.trim()){ toast(ERR.NEED_REASON, true); $('cReason').focus(); return; }
  if(closePay === 'debt' && !closeCust){ toast(ERR.NEED_CUSTOMER, true); return; }
  await busy($('closeGo'), async () => {
    try{
      const r = await T('lounge_close_session', { p_session: q.id, p_discount: d, p_reason: $('cReason').value, p_pay: closePay, p_customer: closePay === 'debt' ? closeCust : null, p_approver_pin: $('cAppr').value || null });
      await refresh(); receiptModal(r);
    }catch(e){ if(e.code === 'APPROVAL'){ $('apprWrap').classList.remove('hidden'); $('cAppr').value=''; $('cAppr').focus(); } fail(e); }
  });
}
let lastReceipt = null;

    ${lines.join('')}

    <div class="row total"><div>المقبوض ${payTag(r.pay_method)}${r.customer ? ' ' + esc(r.customer) : ''}</div><div class="amt gold">${money(r.net)}</div></div>
    <div class="actions"><button class="btn ghost" onclick="printReceipt(lastReceipt)">🖨️ طباعة</button><button class="btn" onclick="closeModal()">تم</button></div>`);

function printReceipt(r){
  $('printArea').innerHTML = `<h4>🎱 نظام الصالة</h4><div style="text-align:center;margin-bottom:8px">${esc(r.device_name)} — ${fmtDT(r.end_at)}</div>

function custPickerHtml(p){

function bindCustPicker(p, onPick){
  const sel = $(p + 'Cust'); if(!sel) return;

  $(p + 'NcGo').onclick = async () => {
    const name = $(p + 'NcName').value.trim(); if(!name){ toast(ERR.NEED_NAME, true); return; }

      const o = document.createElement('option'); o.value = r.id; o.textContent = r.name; sel.insertBefore(o, sel.lastElementChild);
      sel.value = r.id; $(p + 'NewCust').classList.add('hidden'); onPick(r.id); toast('✅ انضاف الزبون');

async function loadShift(){

  if(!v.shift){

    el.innerHTML = `${last ? `<div class="section"><h2>آخر وردية <small>${fmtDT(last.closed_at)} — ${esc(last.closed_by_name)}</small></h2>${diffHtml(last.expected_cash, last.counted_cash, last.diff)}</div>` : ''}
      <div class="section"><h2>فتح وردية جديدة</h2>
      <div class="hint">عدّ المصاري الموجودة بالدرج هلق واكتبها. كل القبض والمصاريف بتنسجل على هالوردية، وبآخرها بتعدّ الدرج والنظام بيطابق.</div>

    <div class="section"><h2>الوردية الحالية <small>${esc(v.shift.opened_by_name)} — ${fmtDT(v.shift.opened_at)}</small></h2>
      <div class="row"><div>النقد عند الفتح</div><div class="amt">${money(v.shift.opening_cash)}</div></div>
      ${sm ? `
      <div class="row"><div>جلسات نقدي</div><div class="amt green">+ ${money(sm.cash_sessions)}</div></div>
      <div class="row"><div>مبيعات مباشرة نقدي</div><div class="amt green">+ ${money(sm.cash_orders)}</div></div>
      <div class="row"><div>تسديد ديون نقدي</div><div class="amt green">+ ${money(sm.debt_paid_cash)}</div></div>
      <div class="row"><div>مصاريف من الدرج</div><div class="amt red">− ${money(sm.expenses)}</div></div>
      <div class="row total"><div>المفروض بالدرج</div><div class="amt gold">${money(sm.expected_cash)}</div></div>
      <div class="row sub"><div>تحويلات (مو بالدرج)</div><div class="amt">${money(sm.transfer_in)}</div></div>
      <div class="row sub"><div>مبيعات دين</div><div class="amt">${money(Number(sm.debt_sessions) + Number(sm.debt_orders))}</div></div>
      <div class="row sub"><div>خصومات</div><div class="amt">${money(sm.discounts)}</div></div>
      ${Number(sm.canceled_count) ? `<div class="row sub"><div class="red">جلسات ملغاة (${fmtNum(sm.canceled_count)})</div><div class="amt red">${money(sm.canceled_value)}</div></div>` : ''}` : `<div class="hint" style="margin-top:8px">🔒 مجموع الدرج المتوقع بيظهر لصاحب المحل بس. بآخر الوردية عدّ الدرج واكتب الموجود بالضبط.</div>`}
    </div>
    <div class="section"><h2>مصروف من الدرج</h2>
      <div class="frow"><input id="expName" placeholder="البيان (فحم، تنباك، صيانة...)" maxlength="60"><input id="expAmt" type="number" inputmode="numeric" placeholder="المبلغ" style="max-width:120px"></div>
      <div class="frow"><button class="btn wide" id="expGo" onclick="addExpense()">إضافة المصروف</button></div>
      ${exps.length ? '<div style="margin-top:8px">' + exps.map(opRow).join('') + '</div>' : ''}
    </div>
    <div class="section"><h2>عمليات الوردية <small>${fmtNum(ops.length)}</small></h2>${ops.length ? ops.map(opRow).join('') : '<div class="empty">ما في عمليات بعد</div>'}</div>

      ${Number(v.open_sessions) ? `<div class="alert warn">في ${fmtNum(v.open_sessions)} جلسة شغالة — رح تنقبض بالوردية الجاية.</div>` : ''}
      <div class="hint">عدّ المصاري بالدرج كلها واكتب المبلغ بالضبط${isOwner() ? '' : ' (النظام ما بيوريك المتوقع — هيك التسليم بيكون نظيف)'}.</div>
      <label>النقد الموجود فعلاً بالدرج</label><input id="countCash" type="number" inputmode="numeric" placeholder="0">

      <div class="frow"><button class="btn red wide" id="closeShiftGo" onclick="closeShiftConfirm()">🔒 إغلاق الوردية</button></div>
    </div>`;
}
function opRow(o){
  const titles = { session:'🎮 ', canceled:'🗑️ ملغاة: ', order:'🍹 ', payment:'📒 تسديد: ', expense:'🧾 ' };
  const sign = o.type === 'expense' ? '− ' : o.type === 'canceled' ? '' : '+ ';
  const cls = o.type === 'expense' ? 'red' : o.type === 'canceled' ? 'muted' : 'gold';
  const isVoid = o.status === 'void' || o.type === 'canceled';
  let canVoid = '';
  if(o.status === 'ok' && o.type === 'order') canVoid = `<button class="mini" onclick="voidOrderModal('${o.id}')">✕</button>`;
  if(o.status === 'ok' && o.type === 'expense') canVoid = `<button class="mini" onclick="voidExpenseModal('${o.id}')">✕</button>`;
  return `<div class="row ${isVoid ? 'void' : ''}"><div><div>${titles[o.type] || ''}${esc(o.title)} ${o.pay ? payTag(o.pay) : ''}${o.status === 'void' ? '<span class="tag void">ملغى</span>' : ''}${Number(o.discount) > 0 ? `<span class="tag">خصم ${fmtNum(o.discount)}</span>` : ''}</div>
    <div class="s">${fmtTime(o.at)} — ${esc(o.staff || '')}${o.reason ? ' — ' + esc(o.reason) : ''}${o.approved_by ? ' — بموافقة ' + esc(o.approved_by) : ''}</div></div>
    <div style="display:flex;gap:6px;align-items:center"><span class="amt ${cls}">${sign}${money(o.amount)}</span>${canVoid}</div></div>`;
}
function diffHtml(exp, cnt, diff){
  diff = Number(diff);
  const st = diff === 0 ? `<div class="alert ok">✅ الدرج مطابق تماماً</div>` : diff < 0 ? `<div class="alert bad">🔻 نقص ${money(-diff)}</div>` : `<div class="alert warn">🔺 زيادة ${money(diff)} (غالباً قبض ما انسجل أو باقي غلط)</div>`;
  return `<div class="row"><div>المفروض بالدرج</div><div class="amt">${money(exp)}</div></div><div class="row"><div>الموجود فعلاً</div><div class="amt">${money(cnt)}</div></div>${st}`;
}

async function addCustomer(){
  const name = $('newCustName').value.trim(); if(!name){ toast(ERR.NEED_NAME, true); return; }
  try{ await T('lounge_add_customer', { p_name: name, p_phone: $('newCustPhone').value }); $('newCustName').value=''; $('newCustPhone').value=''; toast('✅ انضاف الزبون'); loadDebts(); }catch(e){ fail(e); }
}
let ledgerPay = 'cash';

  ledgerPay = 'cash';
  openModal(`<h3>${esc(L.customer.name)}</h3><div class="info">${esc(L.customer.phone || '')}</div>
    <div class="bignum" style="color:${Number(L.balance) > 0 ? 'var(--warn)' : 'var(--felt)'}">${money(L.balance)}</div><div class="info" style="text-align:center">${Number(L.balance) > 0 ? 'عليه' : 'رصيده'}</div>

      <div class="frow"><input id="lpAmt" type="number" inputmode="numeric" placeholder="المبلغ"><button class="btn ghost" onclick="$('lpAmt').value=${Math.max(Number(L.balance),0)}">الكل</button></div>
      <div class="seg" id="lpSeg" style="margin-top:8px"><button class="on" data-v="cash">💵 نقدي</button><button data-v="transfer">📲 تحويل</button></div>
      <div class="frow"><button class="btn wide" id="lpGo" onclick="payDebt('${cid}')">تسجيل التسديد</button></div></div>
    <h3 style="font-size:14px;margin:6px 0">الحركات</h3>
    ${L.entries.length ? L.entries.map(e => `<div class="row ${e.status === 'void' ? 'void' : ''}"><div><div>${e.kind === 'charge' ? '📒 ' : '💵 '}${esc(e.note || (e.kind === 'charge' ? 'دين' : 'تسديد'))} ${e.pay ? payTag(e.pay) : ''}${e.status === 'void' ? '<span class="tag void">ملغى</span>' : ''}</div><div class="s">${fmtDT(e.at)} — ${esc(e.staff || '')}</div></div>

async function payDebt(cid){
  const a = num($('lpAmt').value); if(isNaN(a) || a <= 0){ toast(ERR.BAD_AMOUNT, true); return; }
  await busy($('lpGo'), async () => { try{ await T('lounge_debt_payment', { p_customer: cid, p_amount: a, p_pay: ledgerPay }); toast('✅ انسجل التسديد'); await refresh(); ledgerModal(cid); loadDebts(); }catch(e){ fail(e); } });
}
async function voidPayment(id, cid){
  const reason = prompt('سبب إلغاء الدفعة؟'); if(!reason) return;
  try{ await T('lounge_void_debt_payment', { p_id: id, p_reason: reason }); toast('🗑️ انلغت الدفعة'); ledgerModal(cid); loadDebts(); }catch(e){ fail(e); }
}

let curRange = null, lastReport = null, lastRange = null;
function weekStartDate(d){ const x = dayStart(d); const diff = (x.getDay() + 1) % 7; x.setDate(x.getDate() - diff); return x; }
function rangeOf(key){
  const now = new Date(), end = new Date(now.getTime() + 60000);
  const rs = (S && S.resets) || {};
  const applyReset = (from, scope) => { const r = rs[scope] ? new Date(rs[scope]) : null; return r && r > from ? { from: r, reset: true } : { from, reset: false }; };
  if(key === 'today'){ const a = applyReset(dayStart(), 'daily'); return { from: a.from, to: end, label: 'اليوم', reset: a.reset }; }
  if(key === 'yesterday'){ const t = dayStart(); const y = new Date(t); y.setDate(y.getDate() - 1); return { from: y, to: t, label: 'أمس' }; }
  if(key === 'week'){ const a = applyReset(weekStartDate(), 'weekly'); return { from: a.from, to: end, label: 'هالأسبوع', reset: a.reset }; }
  if(key === 'month'){ const a = applyReset(new Date(now.getFullYear(), now.getMonth(), 1), 'monthly'); return { from: a.from, to: end, label: 'هالشهر', reset: a.reset }; }
  if(key === 'lastmonth'){ return { from: new Date(now.getFullYear(), now.getMonth() - 1, 1), to: new Date(now.getFullYear(), now.getMonth(), 1), label: 'الشهر الماضي' }; }
  if(key === 'custom'){ const f = $('rFrom').value, t = $('rTo').value; if(!f || !t) return null; const to = new Date(t + 'T00:00:00'); to.setDate(to.getDate() + 1); return { from: new Date(f + 'T00:00:00'), to, label: f + ' ← ' + t }; }
}
function buildRangeChips(){
  const keys = [['today','اليوم'],['yesterday','أمس'],['week','الأسبوع'],['month','الشهر'],['lastmonth','الشهر الماضي'],['custom','مخصص']];
  $('rangeChips').innerHTML = keys.map(k => `<button id="rc-${k[0]}" onclick="pickRange('${k[0]}')">${k[1]}</button>`).join('');
  if(curRange) $('rc-' + curRange) && $('rc-' + curRange).classList.add('on');
}
function pickRange(k){
  curRange = k; document.querySelectorAll('#rangeChips button').forEach(b => b.classList.toggle('on', b.id === 'rc-' + k));
  $('customRange').classList.toggle('hidden', k !== 'custom');
  if(k === 'custom'){ if(!$('rFrom').value){ const t = new Date(); $('rTo').value = ymd(t); t.setDate(1); $('rFrom').value = ymd(t); } return; }
  loadReport(k);
}
async function loadReport(k){

  try{
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Damascus';

}

      add('الملخص', [['صافي المبيعات', t.net_sales], ['مبيعات الوقت', t.time_sales], ['مبيعات الأصناف', t.order_sales], ['الخصومات', t.discounts], ['كلفة البضاعة', t.cogs], ['مجمل الربح', t.gross_profit], ['المصاريف', t.expenses], ['صافي الربح', t.net_profit], ['عدد الجلسات', t.sessions]].map(r => ({ 'البند': r[0], 'المبلغ': Number(r[1]) })));
      add('الجلسات', X.sessions.map(s => ({ 'الجهاز': s.device, 'النوع': s.grp, 'البداية': d(s.start), 'النهاية': d(s.end), 'الدقائق': s.minutes, 'المحسوب (د)': s.billed, 'الوقت': Number(s.time), 'الطلبات': Number(s.orders), 'الإجمالي': Number(s.gross), 'الخصم': Number(s.discount), 'سبب الخصم': s.discount_reason || '', 'الصافي': Number(s.net), 'الدفع': PAY[s.pay] || s.pay, 'الزبون': s.customer || '', 'فتح': s.opened_by || '', 'قبض/ألغى': s.closed_by || '', 'موافقة': s.approved_by || '', 'الحالة': s.status === 'canceled' ? 'ملغاة' : 'مقبوضة', 'سبب الإلغاء': s.cancel_reason || '' })));
      add('الطلبات', X.orders.map(o => ({ 'الوقت': d(o.at), 'الصنف': o.product, 'القسم': o.cat || '', 'العدد': o.qty, 'السعر': Number(o.price), 'المجموع': Number(o.total), 'الكلفة': Number(o.unit_cost) * o.qty, 'الربح': Number(o.profit), 'الجهاز': o.device || '', 'الدفع': PAY[o.pay] || o.pay, 'الموظف': o.staff || '', 'الحالة': o.status === 'void' ? 'ملغى' : '', 'سبب الإلغاء': o.void_reason || '' })));
      add('المصاريف', X.expenses.map(e => ({ 'الوقت': d(e.at), 'البيان': e.name, 'المبلغ': Number(e.amount), 'الموظف': e.staff || '', 'الحالة': e.status === 'void' ? 'ملغى' : '', 'سبب الإلغاء': e.void_reason || '' })));
      add('الورديات', X.shifts.map(s => ({ 'الفتح': d(s.opened_at), 'فتحها': s.opened_by, 'نقد الفتح': Number(s.opening), 'الإغلاق': d(s.closed_at), 'سكّرها': s.closed_by || '', 'المتوقع': s.expected == null ? '' : Number(s.expected), 'الموجود': s.counted == null ? '' : Number(s.counted), 'الفرق': s.diff == null ? '' : Number(s.diff), 'ملاحظات': s.notes || '' })));
      add('الديون', X.debts.map(x => ({ 'الوقت': d(x.at), 'الزبون': x.customer, 'النوع': x.kind === 'charge' ? 'دين' : 'تسديد', 'المبلغ': Number(x.amount), 'الدفع': x.pay ? (PAY[x.pay] || x.pay) : '', 'البيان': x.note || '', 'الموظف': x.staff || '', 'الحالة': x.status === 'void' ? 'ملغى' : '' })));
      add('سجل التدقيق', X.audit.map(a => ({ 'الوقت': d(a.at), 'الموظف': a.staff || '', 'العملية': ACT[a.action] || a.action, 'التفاصيل': detailsText(JSON.parse(a.details || '{}')) })));
      const f = ymd;
      const buf = XLSX.write(wb, { bookType:'xlsx', type:'array' });
      const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `lounge_${f(lastRange.from)}_to_${f(new Date(lastRange.to.getTime() - 1))}.xlsx`;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      toast('📥 نزل ملف Excel');
    }catch(e){ fail(e); }
  });
}
function askReset(scope){
  const names = { daily:'اليومي', weekly:'الأسبوعي', monthly:'الشهري' };
  openModal(`<h3>تصفير العرض ${names[scope]}</h3><div class="alert warn">العرض السريع بيبدأ من صفر. البيانات ما بتنمسح.</div>
    <label>كلمة سر التصفير</label><input id="rsPass" type="password" inputmode="numeric" placeholder="••••">
    <label>للتأكيد اكتب كلمة <b>تصفير</b></label><input id="rsConf">
    <div class="actions"><button class="btn ghost" onclick="closeModal()">رجوع</button><button class="btn red" id="rsGo" onclick="doReset('${scope}')">تأكيد</button></div>`);
}
async function doReset(scope){
  if($('rsConf').value.trim() !== 'تصفير'){ toast('اكتب «تصفير» للتأكيد', true); return; }
  await busy($('rsGo'), async () => { try{ await T('lounge_reset_view', { p_scope: scope, p_password: $('rsPass').value }); closeModal(); toast('♻️ انصفّر العرض'); await refresh(); loadReport(curRange || 'today'); }catch(e){ fail(e); } });
}

/* ================== الإعدادات ================== */
let staffAdmin = [];
async function loadSettings(){
  const el = $('settingsBody');
  try{ staffAdmin = await T('lounge_staff_admin'); }catch(e){ el.innerHTML = '<div class="empty">⚠️ ' + esc(e.message) + '</div>'; return; }
  const st = S.settings;
  const grps = Array.from(new Set(Object.keys(GRP_ICON).concat(S.devices.map(d => d.grp)).concat(['أخرى'])));
  const grpOpts = sel => grps.map(g => `<option ${g === sel ? 'selected' : ''}>${esc(g)}</option>`).join('');
  const catOpts = sel => CAT_ORDER.map(c => `<option value="${c}" ${c === sel ? 'selected' : ''}>${CAT_LABEL[c]}</option>`).join('');
  el.innerHTML = `
  <div class="section"><h2>التسعير والفوترة</h2>
    <div class="hint">مثال بالإعدادات الحالية: جلسة 47 دقيقة ← بعد السماح ${fmtNum(st.grace_minutes)} د ← بتنحسب ${fmtNum(exampleBill(47))} د.</div>
    <div class="frow"><div style="flex:1"><label>التقريب كل (دقيقة)</label><input id="stRound" type="number" inputmode="numeric" value="${st.round_minutes}"></div><div style="flex:1"><label>الحد الأدنى (دقيقة)</label><input id="stMin" type="number" inputmode="numeric" value="${st.min_minutes}"></div></div>
    <div class="frow"><div style="flex:1"><label>دقائق سماح</label><input id="stGrace" type="number" inputmode="numeric" value="${st.grace_minutes}"></div><div style="flex:1"><label>أقصى خصم للموظف %</label><input id="stDisc" type="number" inputmode="numeric" value="${st.max_staff_discount}"></div></div>
    <div class="frow"><div style="flex:1"><label>العملة</label><input id="stCur" value="${esc(st.currency)}" maxlength="12"></div></div>
    <div class="frow"><button class="btn wide" onclick="saveSettings(this)">حفظ</button></div></div>

  <div class="section"><h2>الأجهزة <small>${fmtNum(S.devices.length)}</small></h2>
    <div class="hint">تغيير السعر بيطبّق على الجلسات الجديدة بس.</div>
    ${groupBy(S.devices, d => d.grp || 'أخرى', Object.keys(GRP_ICON)).map(([g, list]) => `<div class="catTitle">${GRP_ICON[g] || '📌'} ${esc(g)}</div>` + list.map(d => `
      <div style="border-bottom:1px solid var(--line);padding:6px 0"><div class="frow" style="margin-top:0"><input value="${esc(d.name)}" id="dn-${d.id}" style="flex:2"><select id="dg-${d.id}" style="flex:1.3">${grpOpts(d.grp)}</select></div>
      <div class="frow" style="margin-top:6px"><div style="flex:1;position:relative"><input type="number" inputmode="numeric" value="${d.rate}" id="dr-${d.id}"></div><span class="muted" style="font-size:12px;white-space:nowrap">/ ساعة</span><button class="btn ghost" style="padding:9px 12px" onclick="saveDevice('${d.id}',this)">✓ حفظ</button><button class="mini" onclick="delDevice('${d.id}')">✕</button></div></div>`).join('')).join('')}
    <div class="catTitle">＋ جهاز جديد</div>
    <div class="frow"><input id="ndName" placeholder="الاسم" style="flex:2"><select id="ndGrp" style="flex:1.3">${grpOpts('كمبيوتر')}</select></div>
    <div class="frow"><input id="ndRate" type="number" inputmode="numeric" placeholder="سعر الساعة"></div>
    <div class="frow"><button class="btn wide" onclick="saveDevice(null,this)">إضافة جهاز</button></div></div>

  <div class="section"><h2>الأصناف <small>${fmtNum(S.products.length)}</small></h2>
    <div class="hint">الكلفة = قديش بيكلفك الصنف (سعر الشراء). منها بيطلع الربح الحقيقي بالتقارير.</div>
    ${groupBy(S.products, p => p.cat || 'أخرى', CAT_ORDER).map(([c, list]) => `<div class="catTitle">${CAT_LABEL[c] || esc(c)}</div>` + list.map(p => `
      <div style="border-bottom:1px solid var(--line);padding:6px 0"><div class="frow" style="margin-top:0"><input value="${esc(p.name)}" id="pn-${p.id}" style="flex:2"><select id="pc-${p.id}" style="flex:1.3">${catOpts(p.cat)}</select></div>
      <div class="frow" style="margin-top:6px"><div style="flex:1"><input type="number" inputmode="numeric" value="${p.price}" id="pp-${p.id}" title="السعر"></div><div style="flex:1"><input type="number" inputmode="numeric" value="${p.cost || 0}" id="pk-${p.id}" title="الكلفة"></div><button class="btn ghost" style="padding:9px 10px" onclick="saveProduct('${p.id}',this)">✓</button><button class="mini" onclick="delProduct('${p.id}')">✕</button></div>
      <div class="s muted" style="font-size:11px;margin-top:2px">السعر · الكلفة${Number(p.cost) ? ' · ربح القطعة ' + fmtNum(p.price - p.cost) : ''}</div></div>`).join('')).join('')}
    <div class="catTitle">＋ صنف جديد</div>
    <div class="frow"><input id="npName" placeholder="اسم الصنف" style="flex:2"><select id="npCat" style="flex:1.3">${catOpts('باردة')}</select></div>
    <div class="frow"><input id="npPrice" type="number" inputmode="numeric" placeholder="السعر"><input id="npCost" type="number" inputmode="numeric" placeholder="الكلفة"></div>
    <div class="frow"><button class="btn wide" onclick="saveProduct(null,this)">إضافة صنف</button></div></div>

  <div class="section"><h2>الموظفين</h2>
    ${staffAdmin.map(s => `<div style="border-bottom:1px solid var(--line);padding:8px 0"><div class="frow" style="margin-top:0"><input value="${esc(s.name)}" id="sn-${s.id}" style="flex:2"><select id="sr-${s.id}" style="flex:1.3"><option value="staff" ${s.role === 'staff' ? 'selected' : ''}>موظف</option><option value="owner" ${s.role === 'owner' ? 'selected' : ''}>صاحب محل</option></select></div>
      <div class="frow" style="margin-top:6px"><input id="sp-${s.id}" type="password" inputmode="numeric" maxlength="8" placeholder="رقم سري جديد (اتركه فاضي)"><button class="btn ghost" style="padding:9px 10px" onclick="saveStaff('${s.id}',this)">✓</button>${s.id !== me.id ? `<button class="mini" onclick="delStaff('${s.id}')">✕</button>` : ''}</div>
      ${s.locked ? '<div class="s red" style="font-size:11px">🔒 مقفول بسبب محاولات غلط — احفظه لفك القفل</div>' : ''}</div>`).join('')}
    <div class="catTitle">＋ موظف جديد</div>
    <div class="frow"><input id="nsName" placeholder="الاسم" style="flex:2"><select id="nsRole" style="flex:1.3"><option value="staff">موظف</option><option value="owner">صاحب محل</option></select></div>
    <div class="frow"><input id="nsPin" type="password" inputmode="numeric" maxlength="8" placeholder="رقم سري (4-8 أرقام)"><button class="btn" onclick="saveStaff(null,this)">إضافة</button></div></div>

  <div class="section"><h2>رقمي السري</h2>
    <div class="frow"><input id="myOld" type="password" inputmode="numeric" maxlength="8" placeholder="الرقم الحالي"><input id="myNew" type="password" inputmode="numeric" maxlength="8" placeholder="الرقم الجديد"></div>
    <div class="frow"><button class="btn ghost wide" onclick="changeMyPin(this)">تغيير رقمي</button></div></div>

  <div class="section"><h2>كلمة سر التصفير</h2>
    <div class="frow"><input id="newResetPass" type="password" inputmode="numeric" placeholder="كلمة السر الجديدة (4 خانات عالأقل)"><button class="btn ghost" onclick="saveResetPass(this)">حفظ</button></div></div>`;
}
function exampleBill(m){ const st = S.settings; const r = Math.max(Number(st.round_minutes) || 1, 1); return Math.max(Number(st.min_minutes) || 0, Math.ceil(Math.max(m - (Number(st.grace_minutes) || 0), 0) / r) * r); }
async function saveSettings(btn){
  const vals = { round_minutes: $('stRound').value, min_minutes: $('stMin').value, grace_minutes: $('stGrace').value, max_staff_discount: $('stDisc').value, currency: $('stCur').value };
  for(const k of ['round_minutes','min_minutes','grace_minutes','max_staff_discount']){ const v = num(vals[k]); if(isNaN(v) || v < 0){ toast(ERR.BAD_SETTING, true); return; } vals[k] = String(Math.round(v)); }
  await busy(btn, async () => { try{ await T('lounge_set_settings', { p_settings: vals }); toast('✅ انحفظت الإعدادات'); await refresh(); loadSettings(); }catch(e){ fail(e); } });
}
async function saveDevice(id, btn){
  const name = id ? $('dn-'+id).value : $('ndName').value, grp = id ? $('dg-'+id).value : $('ndGrp').value, rate = num(id ? $('dr-'+id).value : $('ndRate').value);
  if(!name.trim()){ toast(ERR.NEED_NAME, true); return; } if(isNaN(rate) || rate < 0){ toast(ERR.BAD_AMOUNT, true); return; }
  await busy(btn, async () => { try{ await T('lounge_save_device', { p_id: id, p_name: name, p_grp: grp, p_rate: rate }); toast('✅ انحفظ'); await refresh(); loadSettings(); }catch(e){ fail(e); } });
}
async function delDevice(id){
  const d = S.devices.find(x => x.id === id); if(!confirm('حذف ' + d.name + '؟')) return;
  try{ await T('lounge_delete_device', { p_id: id }); toast('🗑️ انحذف'); await refresh(); loadSettings(); }catch(e){ fail(e); }
}
async function saveProduct(id, btn){
  const name = id ? $('pn-'+id).value : $('npName').value, cat = id ? $('pc-'+id).value : $('npCat').value;
  const price = num(id ? $('pp-'+id).value : $('npPrice').value); let cost = num(id ? $('pk-'+id).value : $('npCost').value); if(isNaN(cost)) cost = 0;
  if(!name.trim()){ toast(ERR.NEED_NAME, true); return; } if(isNaN(price) || price < 0 || cost < 0){ toast(ERR.BAD_AMOUNT, true); return; }
  if(cost > price && !confirm('الكلفة أعلى من سعر البيع — يعني خسارة. متأكد؟')) return;
  await busy(btn, async () => { try{ await T('lounge_save_product', { p_id: id, p_name: name, p_cat: cat, p_price: price, p_cost: cost }); toast('✅ انحفظ'); await refresh(); loadSettings(); }catch(e){ fail(e); } });
}
async function delProduct(id){
  const p = S.products.find(x => x.id === id); if(!confirm('حذف ' + p.name + '؟')) return;
  try{ await T('lounge_delete_product', { p_id: id }); toast('🗑️ انحذف'); await refresh(); loadSettings(); }catch(e){ fail(e); }
}
async function saveStaff(id, btn){
  const name = id ? $('sn-'+id).value : $('nsName').value, role = id ? $('sr-'+id).value : $('nsRole').value, pin = (id ? $('sp-'+id).value : $('nsPin').value).trim();
  if(!name.trim()){ toast(ERR.NEED_NAME, true); return; }
  if((pin || !id) && !/^[0-9]{4,8}$/.test(pin)){ toast(ERR.BAD_PIN, true); return; }
  await busy(btn, async () => { try{ await T('lounge_save_staff', { p_id: id, p_name: name, p_pin: pin || null, p_role: role }); toast('✅ انحفظ'); loadSettings(); }catch(e){ fail(e); } });
}
async function delStaff(id){
  const s = staffAdmin.find(x => x.id === id); if(!confirm('حذف ' + s.name + '؟ ما رح يقدر يسجل دخول بعدها.')) return;
  try{ await T('lounge_delete_staff', { p_id: id }); toast('🗑️ انحذف'); loadSettings(); }catch(e){ fail(e); }
}
async function changeMyPin(btn){
  const n = $('myNew').value.trim(); if(!/^[0-9]{4,8}$/.test(n)){ toast(ERR.BAD_PIN, true); return; }
  await busy(btn, async () => { try{ await T('lounge_change_pin', { p_old: $('myOld').value, p_new: n }); $('myOld').value=''; $('myNew').value=''; toast('✅ تغيّر رقمك السري'); }catch(e){ fail(e); } });
}
async function saveResetPass(btn){
  const p = $('newResetPass').value.trim(); if(p.length < 4){ toast(ERR.BAD_PIN, true); return; }
  await busy(btn, async () => { try{ await T('lounge_set_reset_password', { p_new: p }); $('newResetPass').value=''; toast('✅ تغيّرت كلمة سر التصفير'); }catch(e){ fail(e); } });
}

$('todayDate').textContent = new Date().toLocaleDateString('ar-SY',{weekday:'long', day:'numeric', month:'long'});
document.addEventListener('visibilitychange', () => { if(!document.hidden && token) refresh(); });
(async function init(){
  token = store.get('lounge_token');
  if(token){ try{ await enterApp(); return; }catch(e){ token = null; store.del('lounge_token'); } }
  loadLogin();
})();
